[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hta"
version = "0.1.0"
description = "Hyperliquid algo trading: mean reversion + funding capture"
requires-python = ">=3.10"
dependencies = [
    "hyperliquid-python-sdk",
    "python-dotenv",
    "pyyaml",
    "pandas ~= 3.0",
    "numpy ~= 2.4",
    "websockets ~= 16.0",
    "pyarrow ~= 24.0",
    "matplotlib ~= 3.10",
    "fastapi ~= 0.136",
    "uvicorn[standard] ~= 0.46",
    "slowapi ~= 0.1",
    "httpx ~= 0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "black>=24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
# RUF001/002/003 flag legitimate sigma/times glyphs in technical comments;
# we accept the readability tradeoff.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S603"]
"scripts/*" = ["S105", "S106"]
# queries.py composes SQL fragments from a fixed allowlist (event types,
# channel names) — params are always bound. ws.py has best-effort socket
# close cleanup where exceptions are intentionally swallowed.
"src/dashboard_api/queries.py" = ["S608", "E501"]
"src/dashboard_api/ws.py" = ["S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
